site_name: ProductBuildersHQ Frameworks
site_description: Machine-readable specifications for maturity models, capability frameworks, and development lifecycles
site_url: https://productbuildershq.github.io/productbuildershq-frameworks/
repo_url: https://github.com/ProductBuildersHQ/productbuildershq-frameworks
repo_name: productbuildershq-frameworks
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ProductBuildersHQ
    - icon: fontawesome/solid/globe
      link: https://productbuildershq.com

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
  - Frameworks:
    - Overview: frameworks/index.md
    - AIDLC:
      - Overview: frameworks/aidlc/index.md
      - Inception Phase: frameworks/aidlc/inception.md
      - Construction Phase: frameworks/aidlc/construction.md
      - Operations Phase: frameworks/aidlc/operations.md
    - ASDM: frameworks/asdm/index.md
    - AI-DORA: frameworks/ai-dora/index.md
    - AI-SPACE: frameworks/ai-space/index.md
    - PBMM: frameworks/pbmm/index.md
  - API Reference:
    - Go Module: api/go-module.md
  - Integrations:
    - PRISM: integrations/prism.md
    - VisionSpec: integrations/visionspec.md
    - PIDL: integrations/pidl.md
  - Contributing: contributing.md
