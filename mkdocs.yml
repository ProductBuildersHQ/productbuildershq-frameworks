site_name: ProductBuildersHQ Frameworks
site_description: Machine-readable specifications for maturity models, capability frameworks, and development lifecycles
site_url: https://productbuildershq.github.io/productbuildershq-frameworks/
repo_url: https://github.com/ProductBuildersHQ/productbuildershq-frameworks
repo_name: productbuildershq-frameworks
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Light mode first (ProductBuildersHQ default)
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

# ProductBuildersHQ Theme Assets (served from main site)
extra_css:
  - https://productbuildershq.com/css/productbuildershq-mkdocs.css

extra_javascript:
  - https://productbuildershq.com/js/site-nav.min.js
  - https://productbuildershq.com/js/pbhq-nav.js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ProductBuildersHQ
    - icon: fontawesome/solid/globe
      link: https://productbuildershq.com

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
  - Frameworks:
    - Overview: frameworks/index.md
    - AIDLC:
      - Overview: frameworks/aidlc/index.md
      - Inception Phase: frameworks/aidlc/inception.md
      - Construction Phase: frameworks/aidlc/construction.md
      - Operations Phase: frameworks/aidlc/operations.md
    - PDLC: frameworks/pdlc/index.md
    - ASDM: frameworks/asdm/index.md
    - AI-DORA: frameworks/ai-dora/index.md
    - AI-SPACE: frameworks/ai-space/index.md
    - PBMM: frameworks/pbmm/index.md
  - API Reference:
    - Go Module: api/go-module.md
  - Integrations:
    - PRISM: integrations/prism.md
    - VisionSpec: integrations/visionspec.md
    - PIDL: integrations/pidl.md
  - Releases:
    - v0.3.0: releases/v0.3.0.md
    - v0.2.0: releases/v0.2.0.md
    - v0.1.0: releases/v0.1.0.md
  - Changelog: changelog.md
  - Contributing: contributing.md
